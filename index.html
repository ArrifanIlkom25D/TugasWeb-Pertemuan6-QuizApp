<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Interactive Quiz App</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Figtree:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="topbar">
      <h1>Quiz Web Dasar</h1>
      <button id="theme-toggle" class="ghost" type="button" aria-label="Ganti tema">Mode gelap</button>
    </header>

    <!-- Layar 1: pilih kategori -->
    <section id="screen-start" class="card">
      <h2>Pilih kategori</h2>
      <p class="muted">Setiap putaran berisi 5 soal, dengan waktu 15 detik per soal.</p>
      <div id="categories" class="categories"></div>
      <p id="start-highscore" class="muted"></p>
    </section>

    <!-- Layar 2: kuis -->
    <section id="screen-quiz" class="card" hidden>
      <div class="meta">
        <span id="question-count"></span>
        <span id="timer" class="timer" aria-live="off"></span>
        <span id="score-live"></span>
      </div>
      <div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="100">
        <div id="progress-bar" class="progress-bar"></div>
      </div>
      <div id="question-box">
        <h2 id="question-text"></h2>
        <div id="options" class="options"></div>
        <p id="feedback" class="feedback" aria-live="polite"></p>
      </div>
      <button id="next-btn" class="primary" type="button" hidden>Soal berikutnya</button>
    </section>

    <!-- Layar 3: hasil -->
    <section id="screen-result" class="card" hidden>
      <h2>Hasil kuis</h2>
      <p id="final-score" class="final-score"></p>
      <p id="result-message"></p>
      <p id="high-score" class="muted"></p>
      <div class="actions">
        <button id="restart-btn" class="primary" type="button">Ulangi kuis</button>
        <button id="menu-btn" class="ghost" type="button">Ganti kategori</button>
      </div>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
